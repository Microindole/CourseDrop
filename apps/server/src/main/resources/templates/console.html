<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CourseDrop 控制台 — 极客调试中心</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'selector',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800;950&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .font-mono-custom {
      font-family: 'JetBrains Mono', monospace;
    }
    .font-handwritten {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      background: linear-gradient(135deg, #065f46 0%, #059669 50%, #10b981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(16, 185, 129, 0.15));
      display: inline-block;
      padding-right: 0.15em;
    }
    .dark .font-handwritten {
      background: linear-gradient(135deg, #2dd4bf 0%, #34d399 50%, #10b981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.25));
    }
    .sidebar-link {
      border-left: 2px solid transparent;
      transition: color 0.2s ease;
    }
    .sidebar-link-active {
      color: #10b981 !important;
      font-weight: 700;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    html {
      scroll-behavior: smooth;
    }
    /* 卡片切换淡入 */
    .pane-fade-in {
      animation: paneEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes paneEnter {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased bg-grid-pattern relative overflow-x-hidden pb-12 transition-all-300">

<!-- 静态浅晕渲染 -->
<div class="absolute top-[-5%] left-[25%] -z-10 h-[380px] w-[380px] rounded-full bg-emerald-500/5 dark:bg-emerald-500/3 blur-[90px] pointer-events-none"></div>
<div class="absolute bottom-[25%] right-[-5%] -z-10 h-[320px] w-[320px] rounded-full bg-blue-500/5 dark:bg-blue-500/2 blur-[80px] pointer-events-none"></div>

<!-- 顶部导航 -->
<header class="w-full shrink-0 border-b border-zinc-200/50 dark:border-zinc-800/40 bg-white/60 dark:bg-zinc-950/60 backdrop-blur-lg sticky top-0 z-50 transition-all duration-300">
  <div class="mx-auto w-full max-w-7xl px-6 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 group">
      <img th:src="@{/images/logo.svg}" class="w-7 h-7 rounded-lg shadow-sm" alt="CourseDrop Logo">
      <div class="flex flex-col">
        <span class="font-handwritten text-2xl tracking-tight leading-none py-0.5">CourseDrop</span>
        <span class="text-[9px] text-zinc-400 dark:text-zinc-500 font-bold font-mono-custom tracking-wider leading-none mt-0.5">DEBUG CONSOLE</span>
      </div>
    </a>

    <div class="flex items-center gap-3">
      <a href="/help" class="inline-flex items-center gap-1.5 rounded-full border border-zinc-200/80 dark:border-zinc-800/80 bg-white/70 dark:bg-zinc-900/70 px-4 py-1.5 text-xs font-bold text-zinc-600 dark:text-zinc-300 shadow-sm hover:text-zinc-950 dark:hover:text-white transition duration-200">
        使用指南
      </a>
      <button id="theme-toggle" onclick="toggleTheme(event)" class="rounded-full border border-zinc-200/80 dark:border-zinc-800/80 bg-white/70 dark:bg-zinc-900/70 p-2.5 text-zinc-500 dark:text-zinc-400 shadow-sm hover:text-zinc-900 dark:hover:text-white transition-all duration-200">
        <svg id="theme-toggle-light-icon" class="hidden w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
        <svg id="theme-toggle-dark-icon" class="hidden w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </div>
</header>

<!-- 主页面容器 -->
<main class="mx-auto w-full max-w-7xl px-6 flex flex-col lg:flex-row flex-grow py-8 gap-8 items-start opacity-0 z-10">

  <!-- 1. 左侧指令控制菜单 -->
  <aside class="w-full lg:w-64 shrink-0 lg:sticky lg:top-24 max-h-[calc(100vh-8rem)] overflow-y-auto hide-scrollbar bg-white/40 dark:bg-zinc-900/10 rounded-2xl border border-zinc-200/50 dark:border-zinc-800/50 p-4 backdrop-blur-md relative">
    <div class="text-[10px] font-black uppercase text-zinc-400 dark:text-zinc-500 tracking-widest px-2 mb-3 z-10 relative">极客指令</div>
    <nav id="sidebar-nav" class="relative space-y-1 text-xs z-10">
      <div id="sidebar-indicator" class="absolute left-0 w-full rounded-lg transition-all duration-300 pointer-events-none bg-emerald-500/5 dark:bg-emerald-500/10 border-l-2 border-emerald-500 opacity-0" style="top: 0; height: 0;"></div>
      
      <button onclick="switchConsoleTab('health')" id="link-health" class="sidebar-link w-full text-left block px-3 py-2.5 rounded-lg text-zinc-500 dark:text-zinc-400 hover:text-zinc-950 dark:hover:text-white transition-all duration-200 relative">
        !/health 运行状态
      </button>
      <button onclick="switchConsoleTab('caps')" id="link-caps" class="sidebar-link w-full text-left block px-3 py-2.5 rounded-lg text-zinc-500 dark:text-zinc-400 hover:text-zinc-950 dark:hover:text-white transition-all duration-200 relative">
        !/caps 全栈能力
      </button>
      <button onclick="switchConsoleTab('shares')" id="link-shares" class="sidebar-link w-full text-left block px-3 py-2.5 rounded-lg text-zinc-500 dark:text-zinc-400 hover:text-zinc-950 dark:hover:text-white transition-all duration-200 relative">
        !/api/shares 中转通道
      </button>
      <button onclick="switchConsoleTab('env')" id="link-env" class="sidebar-link w-full text-left block px-3 py-2.5 rounded-lg text-zinc-500 dark:text-zinc-400 hover:text-zinc-950 dark:hover:text-white transition-all duration-200 relative">
        !/env 环境参数
      </button>
      <button onclick="switchConsoleTab('info')" id="link-info" class="sidebar-link w-full text-left block px-3 py-2.5 rounded-lg text-zinc-500 dark:text-zinc-400 hover:text-zinc-950 dark:hover:text-white transition-all duration-200 relative">
        !/info 技术架构
      </button>
    </nav>
  </aside>

  <!-- 2. 右侧数据看板与 Raw 终端 -->
  <div class="flex-grow w-full max-w-4xl space-y-6">
    
    <!-- 标题与刷新按钮 -->
    <div class="flex justify-between items-center border-b border-zinc-200/50 dark:border-zinc-800/60 pb-3">
      <div class="flex items-center gap-2.5">
        <span class="font-handwritten text-2xl leading-none">Console</span>
        <h2 id="panel-title" class="text-xl font-extrabold text-zinc-900 dark:text-white">系统运行状态</h2>
      </div>
      <button onclick="refreshCurrentTab()" class="inline-flex items-center gap-1.5 rounded-lg border border-zinc-200/80 dark:border-zinc-800/80 bg-white/70 dark:bg-zinc-900/70 px-3.5 py-1.5 text-xs font-bold text-zinc-600 dark:text-zinc-300 hover:text-zinc-950 dark:hover:text-white transition duration-200">

    </div>

    <!-- 可视化看板渲染容器 -->
    <div id="visual-board" class="min-h-[220px] transition-all duration-300">

    </div>

    <!-- 底部：原始数据终端回显 -->
    <div class="w-full rounded-2xl bg-zinc-950 text-zinc-100 p-5 shadow-xl border border-zinc-800/80 flex flex-col font-mono-custom">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-850 shrink-0 mb-3 text-[10px]">
        <div class="flex gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-zinc-800 block"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-zinc-700 block"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-zinc-650 block"></span>
        </div>
        <span class="text-zinc-500 font-bold uppercase tracking-wider">Raw JSON Stream</span>
        <div class="flex items-center gap-2">

          <span id="output-status" class="text-emerald-500 font-bold">OK</span>

      </div>

    </div>

  </div>

</main>

<script>
  // 获取 Thymeleaf 变量
  const limitSizeMb = "[[${maxFileSizeMb}]]";
  const limitHoursTtl = "[[${defaultTtlHours}]]";
  const limitBaseUrl = "[[${publicBaseUrl}]]";

  const lightIcon = document.getElementById('theme-toggle-light-icon');
  const darkIcon = document.getElementById('theme-toggle-dark-icon');

  function updateIcons() {
    if (document.documentElement.classList.contains('dark')) {
      lightIcon.classList.remove('hidden');
      darkIcon.classList.add('hidden');
    } else {
      lightIcon.classList.add('hidden');
      darkIcon.classList.remove('hidden');
    }
  }
  updateIcons();

  // 暗黑模式切换
  function toggleTheme(event) {
    const isDark = document.documentElement.classList.contains('dark');
    
    if (!document.startViewTransition) {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      updateIcons();
      return;
    }

    const x = event.clientX || window.innerWidth / 2;
    const y = event.clientY || window.innerHeight / 2;
    const endRadius = Math.hypot(
      Math.max(x, window.innerWidth - x),
      Math.max(y, window.innerHeight - y)
    );

    document.documentElement.style.setProperty('--clip-x', `${x}px`);
    document.documentElement.style.setProperty('--clip-y', `${y}px`);
    document.documentElement.style.setProperty('--clip-radius', `${endRadius}px`);

    document.startViewTransition(() => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      updateIcons();
    });
  }

  // 侧边栏高亮块与 Tab 逻辑
  let currentConsoleTab = "";
  const sidebarLinks = document.querySelectorAll(".sidebar-link");
  const indicator = document.getElementById("sidebar-indicator");
  const visualBoard = document.getElementById("visual-board");
  const panelTitle = document.getElementById("panel-title");
  
  const contentPre = document.getElementById("output-content");
  const statusSpan = document.getElementById("output-status");
  const latencySpan = document.getElementById("output-latency");

  function updateIndicator(activeLink) {
    if (activeLink) {
      indicator.style.top = `${activeLink.offsetTop}px`;
      indicator.style.height = `${activeLink.offsetHeight}px`;
      indicator.style.opacity = "1";
    } else {
      indicator.style.opacity = "0";
    }
  }

  function switchConsoleTab(tabName) {
    currentConsoleTab = tabName;
    
    // 更新 Active Link 状态
    let activeLink = null;
    sidebarLinks.forEach((link) => {
      link.classList.remove("sidebar-link-active");
      if (link.getAttribute("id") === `link-${tabName}`) {
        link.classList.add("sidebar-link-active");
        activeLink = link;
      }
    });
    updateIndicator(activeLink);

    // 清空回显
    contentPre.textContent = "";
    statusSpan.textContent = "READY";
    statusSpan.className = "text-zinc-500 font-bold";
    latencySpan.textContent = "WAITING";

    // 载入对应的可视化面板模板
    const template = document.getElementById(`tpl-${tabName}`);
    if (!template) return;
    visualBoard.innerHTML = "";
    visualBoard.appendChild(template.content.cloneNode(true));

    // 执行真实接口请求或本地数据生成
    executeTabLogic(tabName);
  }

  function executeTabLogic(tabName) {
    const startTime = performance.now();

    if (tabName === "health") {
      panelTitle.textContent = "系统运行状态";
      fetch("/api/health")
        .then(res => res.json())
        .then(data => {
          const duration = Math.round(performance.now() - startTime);
          renderResponse(data, "SUCCESS", duration);
          document.getElementById("health-status-text").textContent = data.status || "UP";
          document.getElementById("health-service").textContent = data.service || "coursedrop-server";
          document.getElementById("health-time").textContent = data.timestamp ? new Date(data.timestamp).toLocaleString() : new Date().toLocaleString();
        })
        .catch(err => renderResponse(null, "FAILED", 0, err));
    } else if (tabName === "caps") {
      panelTitle.textContent = "全栈能力配置";
      fetch("/api/health/capabilities")
        .then(res => res.json())
        .then(data => {
          const duration = Math.round(performance.now() - startTime);
          renderResponse(data, "SUCCESS", duration);
          document.getElementById("caps-max-size").textContent = `${data.maxFileSizeMb || 100} MB`;
          document.getElementById("caps-room-ttl").textContent = `${data.roomTtlHours || 24} 小时`;
          document.getElementById("caps-file-ttl").textContent = `${data.fileTtlHours || 168} 小时`;
          
          document.getElementById("caps-e2ee").textContent = data.encryptedTransferSupported ? "✓" : "✗";
          document.getElementById("caps-e2ee").className = data.encryptedTransferSupported
            ? "w-4 h-4 rounded border flex items-center justify-center shrink-0 border-emerald-500/20 bg-emerald-500/10 text-emerald-500"
            : "w-4 h-4 rounded border flex items-center justify-center shrink-0 border-rose-500/20 bg-rose-500/10 text-rose-500";
            
          document.getElementById("caps-public").textContent = data.publicShareSupported ? "✓" : "✗";
          document.getElementById("caps-public").className = data.publicShareSupported
            ? "w-4 h-4 rounded border flex items-center justify-center shrink-0 border-emerald-500/20 bg-emerald-500/10 text-emerald-500"
            : "w-4 h-4 rounded border flex items-center justify-center shrink-0 border-rose-500/20 bg-rose-500/10 text-rose-500";
        })
        .catch(err => renderResponse(null, "FAILED", 0, err));
    } else if (tabName === "shares") {
      panelTitle.textContent = "活跃中转通道";
      fetch("/api/shares?status=ACTIVE")
        .then(res => res.json())
        .then(data => {
          const duration = Math.round(performance.now() - startTime);
          renderResponse(data, "SUCCESS", duration);
          const tbody = document.getElementById("shares-table-body");
          const empty = document.getElementById("shares-empty-state");
          tbody.innerHTML = "";
          if (!data || data.length === 0) {
            empty.classList.remove("hidden");
          } else {
            empty.classList.add("hidden");
            data.forEach(item => {
              const tr = document.createElement("tr");
              tr.className = "hover:bg-zinc-100/30 dark:hover:bg-zinc-900/30 border-b border-zinc-200/20 dark:border-zinc-800/30 transition-colors";
              
              const tdCode = document.createElement("td");
              tdCode.className = "p-4 font-bold text-emerald-500";
              tdCode.textContent = item.code;
              
              const tdType = document.createElement("td");
              tdType.className = "p-4 text-zinc-400 dark:text-zinc-500";
              tdType.textContent = item.ownerIdentityType || "PUBLIC";
              
              const tdExpires = document.createElement("td");
              tdExpires.className = "p-4 text-zinc-500";
              tdExpires.textContent = item.expiresAt ? new Date(item.expiresAt).toLocaleString() : "-";
              
              tr.appendChild(tdCode);
              tr.appendChild(tdType);
              tr.appendChild(tdExpires);
              tbody.appendChild(tr);
            });
          }
        })
        .catch(err => renderResponse(null, "FAILED", 0, err));
    } else if (tabName === "env") {
      panelTitle.textContent = "环境参数快照";
      const envData = {
        publicBaseUrl: limitBaseUrl || window.location.origin,
        maxFileSize: limitSizeMb ? `${limitSizeMb} MB` : "100 MB",
        defaultTtlHours: limitHoursTtl ? `${limitHoursTtl} 小时` : "168 小时",
        clientScheme: "coursedrop://",
        userAgent: navigator.userAgent
      };
      renderResponse(envData, "LOCAL_MOCK");
      document.getElementById("env-base-url").textContent = envData.publicBaseUrl;
      document.getElementById("env-scheme").textContent = envData.clientScheme;
      document.getElementById("env-ua").textContent = envData.userAgent;
    } else if (tabName === "info") {
      panelTitle.textContent = "系统技术架构";
      const infoData = {
        nodeName: "coursedrop-node-0",
        backendStack: "Java 17 / Spring Boot 3 / MyBatis-Plus",
        databaseType: "SQLite 3",
        frontendStack: "Thymeleaf 3 / Tailwind CSS 3.4 CDN",
        artisticFonts: "Caveat / Inter / JetBrains Mono",
        license: "Apache-2.0 License"
      };
      renderResponse(infoData, "LOCAL_MOCK");
      document.getElementById("info-backend").textContent = infoData.backendStack;
      document.getElementById("info-db").textContent = infoData.databaseType;
      document.getElementById("info-frontend").textContent = infoData.frontendStack;
      document.getElementById("info-license").textContent = infoData.license;
    }
  }

  function renderResponse(data, status, duration = 0, err = null) {
    if (err) {
      statusSpan.textContent = "FAILED";
      statusSpan.className = "text-rose-500 font-bold";
      latencySpan.textContent = "ERROR";
      contentPre.textContent = `Error: ${err.message}`;
      return;
    }
    
    contentPre.textContent = JSON.stringify(data, null, 2);
    if (status === "LOCAL_MOCK") {
      statusSpan.textContent = "SUCCESS (LOCAL)";
      statusSpan.className = "text-amber-500 font-bold";
      latencySpan.textContent = "LOCAL";
    } else {
      statusSpan.textContent = "SUCCESS";
      statusSpan.className = "text-emerald-500 font-bold";
      latencySpan.textContent = `${duration}ms`;
    }
  }

  function refreshCurrentTab() {
    if (currentConsoleTab) {
      switchConsoleTab(currentConsoleTab);
    }
  }

  // 往返缓存页面展示及 Tab 抓取初始化
  window.addEventListener("pageshow", () => {
    const mainEl = document.querySelector("main");
    if (mainEl) {
      mainEl.classList.remove("apple-transition-exit", "opacity-0");
      mainEl.classList.add("apple-transition-enter");
    }

    // 从 URL 查询参数确定默认选中的 Tab
    const urlParams = new URLSearchParams(window.location.search);
    const tabParam = urlParams.get("tab") || "health";
    
    // 初始化 Tab 面板
    switchConsoleTab(tabParam);
  });
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CourseDrop 在线手册 — 使用指南与全栈状态</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'selector',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800;950&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .font-mono-custom {
      font-family: 'JetBrains Mono', monospace;
    }
    /* 统一手写艺术字 */
    .font-handwritten {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      background: linear-gradient(135deg, #065f46 0%, #059669 50%, #10b981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(16, 185, 129, 0.15));
      display: inline-block;
      padding-right: 0.15em;
    }
    .dark .font-handwritten {
      background: linear-gradient(135deg, #2dd4bf 0%, #34d399 50%, #10b981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.25));
    }
    
    /* 侧边栏激活状态下的经典高亮 */
    .sidebar-link {
      border-left: 2px solid transparent;
      transition: color 0.2s ease;
    }
    .sidebar-link-active {
      color: #10b981 !important;
      font-weight: 700;
    }
    
    /* 隐藏默认滚动条但保持滚动 */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* 静态终端光标 */
    .terminal-cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background-color: #10b981;
      vertical-align: middle;
      margin-left: 4px;
    }
    
    /* 平滑滚动 */
    html {
      scroll-behavior: smooth;
    }

    /* 物理级微动效控制 */
    .icon-transition {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.2s ease;
    }
    /* PUBLIC 锁钩微开 */
    .group:hover .icon-lock-hook {
      transform: translateY(-2.5px) rotate(-15deg);
      transform-origin: 14px 10px;
    }
    /* LOGIN_REQUIRED 锁及钥匙孔微动 */
    .group:hover .icon-key {
      transform: translateY(-2px);
    }
    /* OWNER_ONLY 安全盾牌缩放 */
    .group:hover .icon-shield {
      transform: scale(1.08);
      transform-origin: center;
    }
    /* 按钮物理动画 */
    .btn-hover-bounce:hover .btn-icon {
      transform: translateY(2px);
    }
    .btn-hover-spin:hover .btn-icon {
      transform: rotate(10deg) scale(1.05);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased bg-grid-pattern relative overflow-x-hidden pb-12 transition-all-300">

<!-- 静态浅晕染背景，去除AI化流光 -->
<div class="absolute top-[-5%] left-[25%] -z-10 h-[380px] w-[380px] rounded-full bg-emerald-500/5 dark:bg-emerald-500/3 blur-[90px] pointer-events-none"></div>
<div class="absolute bottom-[25%] right-[-5%] -z-10 h-[320px] w-[320px] rounded-full bg-blue-500/5 dark:bg-blue-500/2 blur-[80px] pointer-events-none"></div>

<!-- 顶部导航 -->
<header class="w-full shrink-0 border-b border-zinc-200/50 dark:border-zinc-800/40 bg-white/60 dark:bg-zinc-950/60 backdrop-blur-lg sticky top-0 z-50 transition-all duration-300">
  <div class="mx-auto w-full max-w-7xl px-6 h-16 flex items-center justify-between">
    <!-- 左侧 Logo & Title -->
    <a href="/" class="flex items-center gap-3 group">
      <!-- 载入项目原生的 logo.svg -->
      <img th:src="@{/images/logo.svg}" class="w-7 h-7 rounded-lg shadow-sm" alt="CourseDrop Logo">
      <div class="flex flex-col">
        <span class="font-handwritten text-2xl tracking-tight leading-none py-0.5">CourseDrop</span>
        <span class="text-[9px] text-zinc-400 dark:text-zinc-500 font-bold font-mono-custom tracking-wider leading-none mt-0.5">ONLINE MANUAL</span>
      </div>
    </a>

    <!-- 右侧返回首页 & 主题按钮 -->
    <div class="flex items-center gap-3">
      <a href="/" class="inline-flex items-center gap-1.5 rounded-full border border-zinc-200/80 dark:border-zinc-800/80 bg-white/70 dark:bg-zinc-900/70 px-4 py-1.5 text-xs font-bold text-zinc-600 dark:text-zinc-300 shadow-sm hover:text-zinc-950 dark:hover:text-white transition duration-200">
        <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
        门户主页
      </a>
      <button id="theme-toggle" onclick="toggleTheme(event)" class="rounded-full border border-zinc-200/80 dark:border-zinc-800/80 bg-white/70 dark:bg-zinc-900/70 p-2.5 text-zinc-500 dark:text-zinc-400 shadow-sm hover:text-zinc-900 dark:hover:text-white transition-all duration-200">
        <svg id="theme-toggle-light-icon" class="hidden w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
        <svg id="theme-toggle-dark-icon" class="hidden w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </div>
</header>

<!-- 主页面容器：双栏布局 -->
<main class="mx-auto w-full max-w-7xl px-6 flex flex-col lg:flex-row flex-grow py-8 gap-8 items-start opacity-0 z-10">

  <!-- 1. 引入左侧目录导航组件 -->
  <aside th:replace="~{help/sidebar :: sidebar}"></aside>

  <!-- 2. 右侧文档阅读区域 -->
  <div class="flex-grow w-full max-w-4xl space-y-12">
    <!-- 引入前四章节组件 -->
    <div th:replace="~{help/chapters :: chapters}"></div>
    <!-- 引入极客终端组件 -->
    <div th:replace="~{help/terminal :: terminal}"></div>
  </div>

</main>

<!-- 页脚 -->
<footer class="mx-auto w-full max-w-7xl px-6 text-center shrink-0 border-t border-zinc-200/20 dark:border-zinc-900/40 pt-6 mt-12">
  <div class="flex items-center justify-between text-[10px] text-zinc-400 dark:text-zinc-600 font-mono-custom">
    <span>CourseDrop Node &middot; Guide</span>
    <div class="space-x-3">
      <a href="/api/health" class="hover:underline hover:text-emerald-500 transition-colors">/health</a>
      <span>&middot;</span>
      <a href="/api/health/capabilities" class="hover:underline hover:text-emerald-500 transition-colors">/caps</a>
    </div>
  </div>
</footer>

<script>
  const lightIcon = document.getElementById('theme-toggle-light-icon');
  const darkIcon = document.getElementById('theme-toggle-dark-icon');

  function updateIcons() {
    if (document.documentElement.classList.contains('dark')) {
      lightIcon.classList.remove('hidden');
      darkIcon.classList.add('hidden');
    } else {
      lightIcon.classList.add('hidden');
      darkIcon.classList.remove('hidden');
    }
  }
  updateIcons();

  // 暗黑模式切换
  function toggleTheme(event) {
    const isDark = document.documentElement.classList.contains('dark');
    
    if (!document.startViewTransition) {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      updateIcons();
      return;
    }

    const x = event.clientX || window.innerWidth / 2;
    const y = event.clientY || window.innerHeight / 2;
    const endRadius = Math.hypot(
      Math.max(x, window.innerWidth - x),
      Math.max(y, window.innerHeight - y)
    );

    document.documentElement.style.setProperty('--clip-x', `${x}px`);
    document.documentElement.style.setProperty('--clip-y', `${y}px`);
    document.documentElement.style.setProperty('--clip-radius', `${endRadius}px`);

    document.startViewTransition(() => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      updateIcons();
    });
  }

  // 极客终端交互指令运行逻辑
  function runCommand(cmd) {
    const outputDiv = document.getElementById("terminal-output");
    const contentPre = document.getElementById("output-content");
    const statusSpan = document.getElementById("output-status");
    
    if (cmd === "!/clear") {
      outputDiv.classList.add("hidden");
      contentPre.textContent = "";
      return;
    }
    
    const startTime = performance.now();
    let url = "";
    
    if (cmd === "!/health") {
      url = "/api/health";
    } else if (cmd === "!/caps") {
      url = "/api/health/capabilities";
    } else if (cmd === "!/api/shares") {
      url = "/api/shares?status=ACTIVE";
    } else if (cmd === "!/env") {
      // 动态获取 Thymeleaf 参数拼装的变量和客户端信息
      const maxFileSizeMb = "[[${maxFileSizeMb}]]";
      const defaultTtlHours = "[[${defaultTtlHours}]]";
      const envData = {
        publicBaseUrl: window.location.origin,
        maxFileSize: maxFileSizeMb ? `${maxFileSizeMb} MB` : "100 MB",
        defaultTtlHours: defaultTtlHours ? `${defaultTtlHours} 小时` : "168 小时",
        clientScheme: "coursedrop://",
        userAgent: navigator.userAgent
      };
      outputDiv.classList.remove("hidden");
      statusSpan.textContent = "SUCCESS (LOCAL)";
      statusSpan.className = "text-amber-500 font-bold";
      contentPre.textContent = JSON.stringify(envData, null, 2);
      return;
    } else if (cmd === "!/info") {
      const infoData = {
        nodeName: "coursedrop-node-0",
        backendStack: "Java 17 / Spring Boot 3 / MyBatis-Plus",
        databaseType: "SQLite 3",
        frontendStack: "Thymeleaf 3 / Tailwind CSS 3.4 CDN",
        artisticFonts: "Caveat / Inter / JetBrains Mono",
        license: "Apache-2.0 License"
      };
      outputDiv.classList.remove("hidden");
      statusSpan.textContent = "SUCCESS (LOCAL)";
      statusSpan.className = "text-amber-500 font-bold";
      contentPre.textContent = JSON.stringify(infoData, null, 2);
      return;
    }
    
    statusSpan.textContent = "RUNNING...";
    statusSpan.className = "text-zinc-500 font-bold";
    outputDiv.classList.remove("hidden");
    
    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        return res.json();
      })
      .then(data => {
        const duration = Math.round(performance.now() - startTime);
        statusSpan.textContent = `SUCCESS (${duration}ms)`;
        statusSpan.className = "text-emerald-500 font-bold";
        contentPre.textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        statusSpan.textContent = "FAILED";
        statusSpan.className = "text-rose-500 font-bold";
        contentPre.textContent = `Error: ${err.message}`;
      });
  }

  // 苹果风页面平滑转场及同源链接拦截
  window.addEventListener("pageshow", () => {
    const mainEl = document.querySelector("main");
    if (mainEl) {
      // 每次页面展示（包括后退缓存载入）都重置进入转场
      mainEl.classList.remove("apple-transition-exit", "opacity-0");
      mainEl.classList.add("apple-transition-enter");
    }

    // 自动运行通过 URL 传过来的极客快捷命令
    const urlParams = new URLSearchParams(window.location.search);
    const runCmd = urlParams.get("run");
    if (runCmd) {
      setTimeout(() => {
        runCommand(`!/${runCmd}`);
      }, 300); // 延时执行以确保 DOM 已完成最终渲染布局
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    const mainEl = document.querySelector("main");

    // ScrollSpy 滚动监听与左侧目录高亮逻辑，包含滑动背景指示器逻辑
    const sections = document.querySelectorAll("section");
    const sidebarLinks = document.querySelectorAll(".sidebar-link");
    const indicator = document.getElementById("sidebar-indicator");

    function updateIndicator(activeLink) {
      if (activeLink) {
        indicator.style.top = `${activeLink.offsetTop}px`;
        indicator.style.height = `${activeLink.offsetHeight}px`;
        indicator.style.opacity = "1";
      } else {
        indicator.style.opacity = "0";
      }
    }

    function scrollSpy() {
      let currentSectionId = "";
      sections.forEach((section) => {
        const sectionTop = section.offsetTop;
        if (window.scrollY >= sectionTop - 180) {
          currentSectionId = section.getAttribute("id");
        }
      });

      let activeLink = null;
      sidebarLinks.forEach((link) => {
        link.classList.remove("sidebar-link-active");
        const href = link.getAttribute("href");
        if (href === `#${currentSectionId}`) {
          link.classList.add("sidebar-link-active");
          activeLink = link;
        }
      });

      updateIndicator(activeLink);
    }

    window.addEventListener("scroll", scrollSpy);
    window.addEventListener("resize", scrollSpy);
    
    // 初始化高亮状态，由于 offsetTop 渲染需要时间，延迟执行一次
    setTimeout(scrollSpy, 100);
  });
</script>
</body>
</html>
